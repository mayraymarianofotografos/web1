<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mayra & Mariano Fotografi — Sito in aggiornamento</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Poppins:wght@300;400&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --cream: #f5f0eb;
            --dark: #1a1a1a;
            --taupe: #8c847c;
            --beige: #cfc9c4;
            --accent: #362805;
        }

        html, body {
            height: 100%;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: var(--cream);
            color: var(--dark);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* Grano de fondo sutil */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
            pointer-events: none;
            z-index: 0;
        }

        /* Línea decorativa superior */
        .top-line {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--accent), transparent);
            animation: lineReveal 2s ease forwards;
            transform-origin: left;
        }

        @keyframes lineReveal {
            from { transform: scaleX(0); opacity: 0; }
            to { transform: scaleX(1); opacity: 1; }
        }

        .container {
            position: relative;
            z-index: 1;
            text-align: center;
            padding: 2rem;
            max-width: 560px;
            animation: fadeUp 1.2s cubic-bezier(0.4, 0, 0.2, 1) forwards;
            opacity: 0;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(24px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .logo-text {
            font-family: 'Cormorant Garamond', serif;
            font-size: clamp(2rem, 6vw, 3.2rem);
            font-weight: 300;
            letter-spacing: 0.08em;
            color: var(--dark);
            margin-bottom: 0.25rem;
        }

        .logo-text em {
            font-style: italic;
            font-weight: 400;
        }

        .subtitle-brand {
            font-family: 'Poppins', sans-serif;
            font-size: 0.62rem;
            font-weight: 300;
            letter-spacing: 0.35em;
            text-transform: uppercase;
            color: var(--taupe);
            margin-bottom: 3.5rem;
        }

        /* Separador */
        .divider {
            width: 48px;
            height: 1px;
            background: var(--beige);
            margin: 0 auto 3rem;
            animation: fadeUp 1.2s 0.3s cubic-bezier(0.4, 0, 0.2, 1) forwards;
            opacity: 0;
        }

        .message {
            animation: fadeUp 1.2s 0.5s cubic-bezier(0.4, 0, 0.2, 1) forwards;
            opacity: 0;
        }

        .message h1 {
            font-family: 'Cormorant Garamond', serif;
            font-size: clamp(1.4rem, 4vw, 2rem);
            font-weight: 300;
            font-style: italic;
            color: var(--dark);
            line-height: 1.4;
            margin-bottom: 1.25rem;
        }

        .message p {
            font-size: 0.82rem;
            font-weight: 300;
            color: var(--taupe);
            line-height: 1.9;
            letter-spacing: 0.02em;
        }

        .contact {
            margin-top: 3rem;
            animation: fadeUp 1.2s 0.8s cubic-bezier(0.4, 0, 0.2, 1) forwards;
            opacity: 0;
        }

        .contact p {
            font-size: 0.72rem;
            letter-spacing: 0.25em;
            text-transform: uppercase;
            color: var(--beige);
            margin-bottom: 1rem;
        }

        .contact a {
            display: inline-block;
            font-family: 'Poppins', sans-serif;
            font-size: 0.78rem;
            font-weight: 400;
            letter-spacing: 0.12em;
            color: var(--dark);
            text-decoration: none;
            border-bottom: 1px solid var(--beige);
            padding-bottom: 2px;
            transition: border-color 0.3s ease, color 0.3s ease;
        }

        .contact a:hover {
            color: var(--accent);
            border-color: var(--accent);
        }

        /* Línea decorativa inferior */
        .bottom-line {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: var(--beige);
            opacity: 0.5;
        }

        /* Ornamento esquina */
        .corner {
            position: fixed;
            font-family: 'Cormorant Garamond', serif;
            font-size: 0.62rem;
            letter-spacing: 0.2em;
            color: var(--beige);
            text-transform: uppercase;
        }
        .corner.bl { bottom: 1.5rem; left: 2rem; }
        .corner.br { bottom: 1.5rem; right: 2rem; }

        @media (max-width: 480px) {
            .corner { display: none; }
        }
    </style>
</head>
<body>

    <div class="top-line"></div>

    <div class="container">

        <div class="logo-text">Mayra <em>&</em> Mariano Fotografi</div>

        <div class="divider"></div>

        <div class="message">
            <h1>Stiamo lavorando<br>per voi.</h1>
            <p>
                Il sito è temporaneamente in aggiornamento.<br>
                Torneremo presto con qualcosa di ancora più bello.
            </p>
        </div>

    </div>

    <div class="bottom-line"></div>
    <div class="corner bl">Fotografia di matrimonio</div>

</body>
</html>
